name: Publicar no npm

# Publica @hocguard/mcp ao empurrar uma tag vX.Y.Z, ou ao publicar uma release
# no GitHub. Usa trusted publishing (OIDC): nenhum token de npm no repositório.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # stage publish exige npm 11.5.1+ e é o caminho que dispensa marcar
      # "Allow npm publish" no Trusted Publisher.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - name: Confere se a tag bate com a versão do package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          versao="$(node -p "require('./package.json').version")"
          test "$tag" = "$versao" || { echo "Tag $GITHUB_REF_NAME diferente da versão $versao"; exit 1; }
      - run: npm stage publish
